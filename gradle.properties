# Memoria para Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA aun no es totalmente compatible con la configuration cache
# (ver https://github.com/FabricMC/fabric-loom/issues/1349)
org.gradle.configuration-cache=false

# Versiones de Fabric para Minecraft 26.2
# Tomadas de la rama 26.2 de FabricMC/fabric-example-mod.
# Revisa si hay versiones mas nuevas en https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.156.0+26.2

# Propiedades del mod
mod_version=0.1.0
maven_group=com.biblia
archives_base_name=biblia
